<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>题面 · TiMian</title>
    <meta
      name="description"
      content="上传 PDF，AI 生成题库，随时开刷。支持单选、多选、判断与简答，纯静态、无账号、不记录任何答题数据。"
    />
    <meta name="theme-color" content="#f4f6fb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        background: #f4f6fb;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .boot-mark {
        width: 58px;
        height: 58px;
        border-radius: 17px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
        box-shadow: 0 14px 30px -12px rgba(37, 99, 235, 0.65);
      }
      .boot p {
        margin: 0;
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-mark">题</div>
        <p>正在加载…</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 40px; text-align: center; font-size: 14px">
        本应用需要启用 JavaScript 才能使用。
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
